<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/liste-taches"></ion-back-button>
    </ion-buttons>
    <ion-title>Détails de la tâche</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <ng-container *ngIf="tache; else noTask">
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ tache.titre }}</ion-card-title>
        <ion-card-subtitle>Statut : {{ tache.statut }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p><strong>Description :</strong> {{ tache.description || 'Pas de description disponible.' }}</p>
        <p><strong>Projet :</strong> {{ tache.projetId || 'Non lié' }}</p>
        <p><strong>Date de création :</strong> {{ tache.date || 'Non précisée' }}</p>
      </ion-card-content>
    </ion-card>
  </ng-container>

  <ng-template #noTask>
    <p>Aucune tâche trouvée.</p>
  </ng-template>
</ion-content>
