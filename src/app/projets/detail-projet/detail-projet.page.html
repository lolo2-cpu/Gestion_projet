<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/liste-projets"></ion-back-button>
    </ion-buttons>
    <ion-title>Détails du projet</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <ng-container *ngIf="projet; else noProject">
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ projet.nom }}</ion-card-title>
        <ion-card-subtitle>Statut : {{ projet.statut }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p><strong>Budget :</strong> {{ projet.budget }}</p>
        <p><strong>Description :</strong> {{ projet.description || 'Pas de description disponible.' }}</p>
      </ion-card-content>
    </ion-card>
  </ng-container>

  <ng-template #noProject>
    <p>Aucun projet trouvé.</p>
  </ng-template>
</ion-content>
