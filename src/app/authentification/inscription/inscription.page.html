<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Inscription</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-content">
  <div class="auth-container">
    <div class="auth-header">
      <h1>Créer un compte</h1>
      <p>Rejoignez-nous dès maintenant</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <ion-item lines="none" class="form-item">
        <ion-label position="floating">Nom</ion-label>
        <ion-input [(ngModel)]="user.nom" name="nom" required></ion-input>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-label position="floating">Prénom</ion-label>
        <ion-input [(ngModel)]="user.prenom" name="prenom" required></ion-input>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="user.email" name="email" type="email" required></ion-input>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-label position="floating">Mot de passe</ion-label>
        <ion-input [(ngModel)]="user.password" name="password" type="password" required></ion-input>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-label position="floating">Confirmer mot de passe</ion-label>
        <ion-input [(ngModel)]="user.confirmPassword" name="confirmPassword" type="password" required></ion-input>
      </ion-item>

      <div *ngIf="messageErreur" class="error-message">
        {{ messageErreur }}
      </div>

      <div *ngIf="messageSucces" class="success-message">
        {{ messageSucces }}
      </div>

      <ion-button expand="block" type="submit" color="primary" class="auth-button">
        S'inscrire
      </ion-button>
    </form>

    <div class="auth-footer">
      <p>Vous avez déjà un compte?</p>
      <ion-button fill="clear" routerLink="/connexion" class="link-button">
        Se connecter
      </ion-button>
    </div>
  </div>
</ion-content>
