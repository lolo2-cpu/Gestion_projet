<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Accueil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="welcome-section">
    <h1>Bienvenue dans Gestion Projet</h1>
    <p>Application moderne de gestion de projets avec Ionic</p>
  </div>

  <div class="features-section">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Fonctionnalités disponibles</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ul>
          <li>Gestion des projets</li>
          <li>Suivi des tâches</li>
          <li>Gestion des utilisateurs</li>
          <li>Rapports et statistiques</li>
        </ul>
      </ion-card-content>
    </ion-card>
  </div>

  <div class="action-buttons">
    <ion-button routerLink="/inscription" color="primary" expand="block">
      S'inscrire
    </ion-button>
    <ion-button routerLink="/connexion" color="primary" expand="block">
      Se connecter
    </ion-button>
  </div>
</ion-content>
