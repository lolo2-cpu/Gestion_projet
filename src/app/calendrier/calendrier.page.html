<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Calendrier</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="calendar-content">
  <div class="calendar-header">
    <h2>Calendrier des projets</h2>
    <p>Gérez vos événements et déadlines</p>
  </div>

  <div class="calendar-container">
    <div class="calendar-placeholder">
      <ion-icon name="calendar-outline"></ion-icon>
      <h3>Calendrier en cours de développement</h3>
      <p>Fonctionnalité de calendrier à implémenter</p>
      <ion-button color="primary">Nouvel événement</ion-button>
    </div>
  </div>
</ion-content>
