<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Discussion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Discussion</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="chat-container">
    <ion-list>
      <ion-item *ngFor="let message of messages">
        <ion-avatar slot="start">
          <img [src]="message.avatar || 'assets/icon/default-avatar.png'" alt="Avatar">
        </ion-avatar>
        <ion-label>
          <h3>{{ message.auteur }}</h3>
          <p>{{ message.contenu }}</p>
          <span class="message-time">{{ message.heure }}</span>
        </ion-label>
      </ion-item>
    </ion-list>

    <ion-item>
      <ion-input placeholder="Tapez votre message..." [(ngModel)]="nouveauMessage"></ion-input>
      <ion-button slot="end" (click)="envoyerMessage()">Envoyer</ion-button>
    </ion-item>
  </div>
</ion-content>
